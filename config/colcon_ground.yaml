# Run colcon from the repository root.
log-base: runtime/native/ground/log
build:
  base-paths:
  - third_party/ros_interfaces
  - third_party/flyco_ros2
  - ros2/flyco_real
  - third_party/px4_msgs
  build-base: runtime/native/ground/build
  install-base: runtime/native/ground/install
  symlink-install: true
  packages-up-to:
  - flyco_real
  executor: sequential
  cmake-args:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_CXX_FLAGS_RELEASE=-O1
  - -DFLYCO_USE_BUNDLED_EMBREE=OFF
  - -DFLYCO_BUILD_LEGACY_SIM_CONTROL=OFF
  - -DFLYCO_BUILD_ALGORITHMS=OFF
  - -DBUILD_SYSTEM=ROS2
  - -DODIN_BUILD_EXTRAS=OFF
  - -DODIN_ENABLE_BACKTRACE=OFF
  - -DPython3_EXECUTABLE=/usr/bin/python3
  - -DPYTHON_EXECUTABLE=/usr/bin/python3
  - -DBUILD_TESTING=OFF
