# PX4 native DDS; use the firmware message definitions pinned in third_party/px4_msgs.
# Device calibration is read from Odin automatically.
# Confirm vehicle mounting frames and network settings at hardware deployment.
deployment:
  profile: odin
  ros_domain_id: 0
  rmw_implementation: rmw_fastrtps_cpp
  semantic_bind: 127.0.0.1
  semantic_port: 8851
  ground_cuda_home: /usr/local/cuda-11.8
  px4_topic_prefix: /fmu
odin:
  register_keys:
    use_host_ros_time: 2
    custom_map_mode: 0
    sendrgb: 1
    sendrgbundistort: 1
    sendrgbcompressed: 0
    sendimu: 1
    sendodom: 1
    send_odom_baselink_tf: 0
    tf_extra_publish_rate: 0
    sendcloudslam: 1
    sendcloudrender: 0
    senddepth: 0
    sendreprojection: 0
    sendoverlay: 0
    recorddata: 0
    devstatuslog: 0
    showpath: 0
    showcamerapose: 0
odin_adapter:
  ros__parameters:
    body_frame: base_link
    imu_frame: imu
    lidar_frame: lidar
    camera_optical_frame: odin_camera_optical_frame
    # Vehicle mounting transform: T_base_link_imu, metres and XYZW quaternion.
    # Odin's internal IMU/LiDAR/camera calibration comes from /odin1/wiwc.
    # These identity values only apply when base_link and the IMU frame coincide.
    body_to_imu_translation:
    - 0.0
    - 0.0
    - 0.0
    body_to_imu_quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
sensor_bridge:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odin1/odometry_highfreq
    cloud_topic: /odin1/cloud_slam
    image_topic: /odin1/image/undistorted
    camera_info_topic: /odin1/camera_info
    image_is_rectified: true
    lio_parent_frame: odom
    lio_child_frame: imu
    lio_twist_frame: child
    world_frame: world
    body_frame: base_link
    camera_optical_frame: odin_camera_optical_frame
    world_from_lio_translation:
    - 0.0
    - 0.0
    - 0.0
    world_from_lio_quaternion:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
    publish_external_vision: true
    external_vision_frame: FRD  # Arbitrary SLAM heading; NED requires North alignment.
    pose_variances:
    - 0.04
    - 0.04
    - 0.09
    - 0.01
    - 0.01
    - 0.02
    max_sensor_age: 0.4
    cloud_voxel_size: 0.15
    odom_publish_rate: 50.0
    px4_topic_prefix: /fmu
px4_bridge:
  ros__parameters:
    use_sim_time: false
    enable_control: false
    world_frame: world
    odom_timeout: 0.3
    command_timeout: 0.3
    rate: 50.0
    warmup_seconds: 1.2
    bounds_min:
    - -30.0
    - -30.0
    - -0.5
    bounds_max:
    - 30.0
    - 30.0
    - 10.0
    max_speed: 1.5
    max_acceleration: 3.0
    max_yaw_rate: 1.0
    max_position_error: 2.0
    ground_link_timeout: 5.0
    px4_topic_prefix: /fmu
sam_tracking:
  ros__parameters:
    segmentation_backend: semantic
    segmentation_endpoint: http://127.0.0.1:8851
    segmentation_timeout: 3.0
    camera_optical_frame: odin_camera_optical_frame
    cloud_sync_slop: 0.08
    min_height: 0.25
flyco_planner:
  ros__parameters:
    flyco_planner.initial_vertical_relative: true
    flyco_planner.initial_height: 2.0
    hcplanner.vmax_: 1.0
    hctraj.vmax_: 1.0
    hcplanner.amax_: 2.0
    hctraj.amax_: 2.0
    sdf_map.map_size_x: 64.0
    sdf_map.map_size_y: 64.0
    sdf_map.map_size_z: 12.0
    sdf_map.map_back_x: -32.0
    sdf_map.map_back_y: -32.0
    sdf_map.ground_height: -0.5
    sdf_map.virtual_ceil_height: 10.0
    viewpoint_manager.GroundPos: 0.0
    viewpoint_manager.TopPos: 10.0
    viewpoint_manager.viewpoints_distance: 8.0
    viewpoint_manager.attitude_type: yaw
    viewpoint_manager.pitch_upper: 0.0
    viewpoint_manager.pitch_lower: 0.0
sam_tracking_node:
  ros__parameters:
    min_height: 0.25
mesh_predict_node:
  ros__parameters:
    min_height: 0.25
    recall_threshold: 0.9
    observation_voxel_size: 0.6
prompt_ui:
  ros__parameters:
    initial_text_prompt: 一个煤堆
traj_server:
  ros__parameters:
    traj_server.pitch_upper: 0.0
    traj_server.pitch_lower: 0.0
